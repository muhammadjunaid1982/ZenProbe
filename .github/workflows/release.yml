name: Release

# Push a tag like v0.1.0 to build the installer and publish a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            installer
      - name: Test
        run: cargo test --release
      - name: Build installer
        shell: pwsh
        run: ./build-installer.ps1
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" (Get-ChildItem dist/*.exe).FullName --title "ZenBruno ${{ github.ref_name }}" --generate-notes
